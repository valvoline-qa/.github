name: Validate PR Title

# SECURITY NOTES
# - Trigger is `pull_request` (NOT `pull_request_target`). For PRs from forks this
#   means the job runs WITHOUT access to repository secrets. Do not change this.
# - No `actions/checkout` step: repository code is never fetched or executed here,
#   so untrusted code from a fork PR cannot run on the runner.
# - No third-party actions are used: no supply-chain exposure, nothing to pin.
# - No secrets, tokens, or context values are echoed. On public repositories both
#   the logs and the job summary are world-readable, so output is limited to the
#   PR title (already public) plus static documentation.
# - The PR title is read via `env:`, never interpolated with ${{ }} inside `run:`.
#   Direct interpolation would allow shell injection from an attacker-controlled title.

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

# No GITHUB_TOKEN scopes are needed: the job only reads the event payload.
permissions: {}

jobs:
  validate-pr-title:
    name: Check PR Title Format
    runs-on: [self-hosted]
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Validate PR title
        shell: bash
        env:
          # Untrusted, attacker-controllable input. Treated as data only.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -uo pipefail

          # ── Normalize (validation input) ───────────────────────────────
          # Strip control characters, including newlines. Without this, a
          # multi-line title such as "junk\nfeat: x AB#1" would pass, because
          # grep matches line by line and only needs ONE line to match.
          TITLE=$(printf '%s' "$PR_TITLE" | tr -d '\000-\037')

          # ── Sanitize (display only) ────────────────────────────────────
          # Neutralize characters that could break out of, or inject into, the
          # Markdown job summary (backtick, pipe, backslash, angle brackets).
          # Truncated to bound the output size.
          SAFE_TITLE=$(printf '%s' "$TITLE" | sed 's/[`|\\<>]/ /g' | cut -c1-200)

          # Regex pattern:
          # ^(type)(optional scope): description AB#<number>$
          #
          # type    → feat | fix | docs | style | refactor | perf | test | build | ci | chore | revert
          # scope   → optional, alphanumeric, underscores + hyphens, wrapped in parentheses
          # desc    → any non-empty text
          # ticket  → AB# followed by one or more digits
          PATTERN='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9_-]+\))?: .+ AB#[0-9]+$'

          # `printf '%s'` instead of `echo`: a title beginning with "-e" or "-n",
          # or containing backslash escapes, would otherwise be consumed as an
          # option or reinterpreted by echo, altering what actually gets matched.
          if printf '%s' "$TITLE" | grep -qE "$PATTERN"; then
            VALID=true
          else
            VALID=false
          fi

          # ── Job Summary ────────────────────────────────────────────────
          {
            if [ "$VALID" = "true" ]; then
              echo "## ✅ PR Title Validation — Passed"
              echo ""
              echo "| | |"
              echo "|---|---|"
              echo "| **Title** | \`$SAFE_TITLE\` |"
              echo "| **Result** | Matches the required format |"
            else
              echo "## ❌ PR Title Validation — Failed"
              echo ""
              echo "| | |"
              echo "|---|---|"
              echo "| **Title** | \`$SAFE_TITLE\` |"
              echo "| **Result** | Does not match the required format |"
              echo ""
              echo "---"
              echo ""
              echo "### 📋 Required Format"
              echo ""
              echo "\`\`\`"
              echo "<type>[optional scope]: <description> AB#<ticket_id>"
              echo "\`\`\`"
              echo ""
              echo "### 🏷️ Allowed Types"
              echo ""
              echo "| Type | When to use |"
              echo "|---|---|"
              echo "| \`feat\` | New feature |"
              echo "| \`fix\` | Bug fix |"
              echo "| \`docs\` | Documentation only |"
              echo "| \`style\` | Formatting, missing semi-colons, etc |"
              echo "| \`refactor\` | Code change that is not a fix nor a feature |"
              echo "| \`perf\` | Performance improvement |"
              echo "| \`test\` | Adding or fixing tests |"
              echo "| \`build\` | Build system or external dependencies |"
              echo "| \`ci\` | CI/CD configuration |"
              echo "| \`chore\` | Other changes that don't modify src or test |"
              echo "| \`revert\` | Reverts a previous commit |"
              echo ""
              echo "### ✅ Valid Examples"
              echo ""
              echo "| Example | Notes |"
              echo "|---|---|"
              echo "| \`feat(auth): add OAuth login AB#1234\` | With scope |"
              echo "| \`fix: resolve null pointer on startup AB#567\` | Without scope |"
              echo "| \`chore(deps): update packages AB#99\` | Dependency update |"
              echo "| \`docs: update README with setup steps AB#300\` | Documentation |"
              echo ""
              echo "### ❌ Invalid Examples"
              echo ""
              echo "| Example | Problem |"
              echo "|---|---|"
              echo "| \`add login page AB#1234\` | Missing type |"
              echo "| \`feat: add login page\` | Missing Azure ticket (AB#) |"
              echo "| \`feat: add login page #1234\` | Wrong ticket prefix (must be \`AB#\`) |"
              echo "| \`Feat: add login page AB#1234\` | Type must be lowercase |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # ── Exit ───────────────────────────────────────────────────────
          if [ "$VALID" = "false" ]; then
            printf '\n%s\n' "❌ PR title does NOT match the required format."
            printf '%s\n' "   Title    : $SAFE_TITLE"
            printf '%s\n' "   Expected : <type>[optional scope]: <description> AB#<ticket_id>"
            exit 1
          fi

          printf '%s\n' "✅ PR title is valid!"
